<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    height: 100vh;
    background: url(imagens/fundo.png);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 500px;
    height: 96%;
    background: #2b2b2b;
    padding: 30px 25px;
    border-radius: 8px;
    color: #fff;
    text-align: center;
}

h1{
    margin-top: -35px;
    margin-bottom: 50px;
}

.avatar {
    width: 50%;
    height: 50%;
    border-radius: 50%;
    
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
   
}

.login-container h2 {
    margin-bottom: 20px;
    font-size: 20px;
}

.radio-group {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 14px;
}

.radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}

input[type="radio"] {
    accent-color: red;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #1f1f1f;
    color: #fff;
    font-size: 14px;
}

.input-group input::placeholder {
    color: #777;
}

.forgot {
    text-align: right;
    font-size: 13px;
    margin-bottom: 20px;
}

.forgot a {
    color: #fff;
    text-decoration: none;
}

.forgot a span {
    color: red;
    margin-left: 5px;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #b30000;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    
    background: #8f0000;
}

.register {
    margin-top: 20px;
    font-size: 13px;
}

.register a {
    color: #fff;
    text-decoration: none;
}

.register span {
    color: red;
    margin-left: 5px;
}

.back-home {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 5px;

}

.back-home .arrow {
    color: red;
    font-size: 35px;
}

.back-home:hover {
    opacity: 0.8;
}

@media (max-width: 1400px) {
            .login-container {
                width: 40%;
                padding: 20px;
              height: 900px;
            }

            .avatar {
                width: 65%;
                height: 65%;
                font-size: 30px;
                margin-top: -40px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 30px;
                margin-top: -170px;
            }

            .radio-group {
                flex-direction: row;
                align-items: center;

            }

            .radio-group label {
                margin-bottom: 10px;
            }

            .input-group input {
                font-size: 16px;
                padding: 10px;
            }

            .btn {
                  padding: 15px ;
    font-size: 14px;
            }

            .forgot, .register {
                font-size: 12px;
            }
        }


 @media (max-width: 768px) {
            .login-container {
                width: 90%;
                padding: 30px;
              
            }

            .avatar {
                width: 70%;
                height: 70%;
                font-size: 30px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 30px;
            }

            .radio-group {
                flex-direction: column;
                align-items: center;
            }

            .radio-group label {
                margin-bottom: 10px;
            }

            .input-group input {
                font-size: 16px;
                padding: 10px;
            }

            .btn {
                  padding: 07px ;
    font-size: 14px;
            }

            .forgot, .register {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                width: 100%;
                padding: 15px;
                  height: 400px;
            }

            .avatar {
                width: 80%;
                height: 80%;
                font-size: 25px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .input-group input {
                font-size: 14px;
                padding: 8px;
            }

            .btn {
                
                font-size: 13px;
            }
        }
</style>
</head>

<body>

<header><a href="#" class="back-home">
    <span class="arrow">←</span> Voltar para o home
</a></header>

<div class="login-container">
    <div class="avatar"><img src="imagens/ft de perfil.png" alt=""></div>
    <h1>Bem vindo!</h1>

    <div class="radio-group">
        <label>
            <input type="radio" name="tipo" checked>
            Pessoa Física
        </label>

        <label>
            <input type="radio" name="tipo">
            Pessoa Jurídica
        </label>
    </div>

    <div id="message" style="margin-bottom: 15px; min-height: 20px; font-size: 14px;"></div>

    <form id="loginForm">
        <div class="input-group">
            <input type="email" id="loginEmail" placeholder="Email" required>
        </div>
        <div class="input-group">
            <input type="password" id="loginPassword" placeholder="Senha" required>
        </div>

        <div class="forgot">
            <a href="#">Esqueci minha senha <span>→</span></a>
        </div>

        <a href=""></a><button type="submit" class="btn">Entrar no PrimeWay</button>
    </form>

    <div class="register">
        <a href="cadastro.html">Ainda não sou cliente <span>→</span></a>
    </div>
</div>


<!-- Inclua o SDK do Firebase E SEU SCRIPT DE AUTENTICAÇÃO -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="firebase.js"></script>

    <script>
        // Lógica específica desta página para interagir com auth.js
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            await window.loginUser(email, password);
        });
    </script>
</body>
</html>
