<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    height: 100vh;
    background: url(imagens/fundo.png);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 500px;
    height: 96%;
    background: #2b2b2b;
    padding: 30px 25px;
    border-radius: 8px;
    color: #fff;
    text-align: center;
}

h1{
    margin-top: -35px;
    margin-bottom: 50px;
}

.avatar {
    width: 50%;
    height: 40%;
    border-radius: 50%;
    
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
   
}

.login-container h2 {
    margin-bottom: 20px;
    font-size: 20px;
}

.radio-group {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 14px;
}

.radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}

input[type="radio"] {
    accent-color: red;
}

.input-group {
    margin-bottom: 15px;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #1f1f1f;
    color: #fff;
    font-size: 14px;
}

.input-group input::placeholder {
    color: #777;
}

.forgot {
    text-align: right;
    font-size: 13px;
    margin-bottom: 20px;
}

.forgot a {
    color: #fff;
    text-decoration: none;
}

.forgot a span {
    color: red;
    margin-left: 5px;
}

.btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #b30000;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 20px;
}

.btn:hover {
    
    background: #8f0000;
}

.register {
    margin-top: 20px;
    font-size: 13px;
}

.register a {
    color: #fff;
    text-decoration: none;
}

.register span {
    color: red;
    margin-left: 5px;
}

.back-home {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 5px;

}

.back-home .arrow {
    color: red;
    font-size: 35px;
}

.back-home:hover {
    opacity: 0.8;
}

.cadastre{
    margin-top: 10px;
    position: absolute;
    margin-left: 9%;
}

 @media (max-width: 768px) {
            .login-container {
                width: 90%;
                padding: 20px;
            }

            .avatar {
                width: 80%;
                height: 80%;
                font-size: 30px;
                
            }

            h1 {
                font-size: 24px;
                margin-bottom: 30px;
            }

            .radio-group {
                flex-direction: column;
                align-items: center;
            }

            .radio-group label {
                margin-bottom: 10px;
            }

            .input-group input {
                font-size: 16px;
                padding: 10px;
            }

            .btn {
                padding: 12px;
                font-size: 14px;
            }

            .forgot, .register {
                font-size: 12px;
            }


        }

        @media (max-width: 480px) {
            .login-container {
                width: 100%;
                padding: 15px;
            }

            .avatar {
                width: 90%;
                height: 90%;
                font-size: 25px;
                 
            }

            h1 {
                font-size: 20px;
                margin-bottom: 20px;
            }

            .input-group input {
                font-size: 14px;
                padding: 8px;
            }

            .btn {
                padding: 10px;
                font-size: 13px;

            }

        }
</style>
</head>

<body>

<header><a href="#" class="back-home">
    <span class="arrow">←</span> Voltar para o home
</a></header>

<div class="login-container">
     <h1 class="cadastre">Cadastre-se já</h1>
    <div class="avatar"><img src="imagens/logo-removebg-preview (1).png" alt=""></div>


    <div class="radio-group">
        <label>
            <input type="radio" name="tipo" checked>
            Pessoa Física
        </label>

        <label>
            <input type="radio" name="tipo">
            Pessoa Jurídica
        </label>
    </div>

    <div id="message" style="margin-bottom: 15px; min-height: 20px; font-size: 14px;"></div>

    <form id="signupForm">
        <div class="input-group">
            <input type="email" id="signupEmail" placeholder="Insira seu Email" required>
        </div>
        <div class="input-group">
            <input type="password" id="signupPassword" placeholder="Crie uma senha" required>
        </div>

        <button type="submit" class="btn">Criar conta</button>
    </form>
    
</div>

<!-- Inclua o SDK do Firebase E SEU SCRIPT DE AUTENTICAÇÃO -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="firebase.js"></script>

    <script>
        // Lógica específica desta página para interagir com auth.js
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            await window.signupUser(email, password);
        });
    </script>

</body>
</html>
